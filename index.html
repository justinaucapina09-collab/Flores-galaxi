<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Flores hacia la galaxia</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#02020b;
 font-family:Arial,sans-serif;
}

canvas{
 display:block;
 width:100%;
 height:100%;
 touch-action:none;
}

#hint{
 position:fixed;
 left:50%;
 bottom:24px;
 transform:translateX(-50%);
 color:white;
 background:rgba(0,0,0,.45);
 padding:10px 16px;
 border-radius:22px;
 font-size:14px;
 text-align:center;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="hint">
Arrastra con el dedo o mouse ✨
</div>

<script>

const c=document.getElementById("c");
const x=c.getContext("2d");

let W,H,dpr;
let px=0,py=0;
let down=false;

function resize(){

 dpr=Math.min(devicePixelRatio||1,2);

 W=innerWidth;
 H=innerHeight;

 c.width=W*dpr;
 c.height=H*dpr;

 x.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener("resize",resize);
resize();

const stars=Array.from({length:420},()=>({
 a:Math.random()*Math.PI*2,
 r:Math.random(),
 s:.2+Math.random()*1.4
}));

const flowers=Array.from({length:65},()=>({
 x:Math.random(),
 y:.72+Math.random()*.3,
 size:8+Math.random()*16,
 phase:Math.random()*6.28,
 speed:.2+Math.random()*.7
}));

function flower(f,t,fade){

 let X=f.x*W+
 Math.sin(t*f.speed+f.phase)*12;

 let Y=f.y*H-
 Math.max(0,t-1.2)*H*.045;

 let S=f.size*
 (1+Math.max(0,t-1.2)*.6);

 x.save();

 x.globalAlpha=Math.max(0,fade);

 x.translate(X,Y);

 x.rotate(Math.sin(t+f.phase)*.08);

 x.strokeStyle="rgba(80,160,80,.7)";
 x.lineWidth=2;

 x.beginPath();
 x.moveTo(0,S*1.8);
 x.lineTo(0,0);
 x.stroke();

 for(let i=0;i<6;i++){

  let a=i*Math.PI/3;

  x.fillStyle=
  `hsl(${320+i*7},85%,70%)`;

  x.beginPath();

  x.ellipse(
   Math.cos(a)*S*.48,
   Math.sin(a)*S*.48,
   S*.42,
   S*.72,
   a,
   0,
   Math.PI*2
  );

  x.fill();
 }

 x.fillStyle="#ffd84d";

 x.beginPath();
 x.arc(0,0,S*.27,0,Math.PI*2);
 x.fill();

 x.restore();
}

let start=performance.now();

function draw(now){

 let t=(now-start)/1000;

 let cycle=22;
 let q=t%cycle;

 let galaxy=q>7?q-7:0;

 let g=Math.min(
  1,
  Math.max(0,(q-7)/5)
 );

 let sky=x.createLinearGradient(0,0,0,H);

 sky.addColorStop(0,"#01010a");
 sky.addColorStop(1,"#070014");

 x.fillStyle=sky;
 x.fillRect(0,0,W,H);

 /*
 GALAXIA
 */

 x.save();

 x.translate(
  W/2+px,
  H/2+py
 );

 for(const s of stars){

  let spin=.15*galaxy+s.a;

  let rr=
   (s.r*.85+.08)*
   Math.min(W,H)*.72;

  let xx=Math.cos(spin)*rr;
  let yy=Math.sin(spin)*rr*.38;

  let tw=
   .35+
   .65*Math.abs(
    Math.sin(now*.002*s.s+s.r*9)
   );

  x.fillStyle=
   `rgba(220,225,255,${tw*g})`;

  x.beginPath();

  x.arc(
   xx,
   yy,
   Math.max(.5,s.s*g),
   0,
   Math.PI*2
  );

  x.fill();
 }

 let glow=x.createRadialGradient(
  0,0,0,
  0,0,
  Math.min(W,H)*.35
 );

 glow.addColorStop(
  0,
  `rgba(255,245,220,${.95*g})`
 );

 glow.addColorStop(
  .18,
  `rgba(150,100,255,${.35*g})`
 );

 glow.addColorStop(
  1,
  "rgba(0,0,0,0)"
 );

 x.fillStyle=glow;

 x.beginPath();

 x.arc(
  0,
  0,
  Math.min(W,H)*.38,
  0,
  Math.PI*2
 );

 x.fill();

 x.restore();

 /*
 FLORES
 */

 let flowerFade=
  q<7
  ?1
  :Math.max(0,1-(q-7)/4);

 flowers.forEach(
  f=>flower(f,t,flowerFade)
 );

 /*
 EFECTO DE VIAJE
 */

 if(q>7){

  x.save();

  x.translate(
   W/2+px,
   H/2+py
  );

  for(let i=0;i<35;i++){

   let z=
    ((i/35)+(galaxy*.13))%1;

   let r=
    z*z*Math.max(W,H);

   let a=
    i*2.399+
    galaxy*.7;

   x.strokeStyle=
    `rgba(255,255,255,
    ${g*(1-z)*.16})`;

   x.lineWidth=1;

   x.beginPath();

   x.moveTo(
    Math.cos(a)*r*.03,
    Math.sin(a)*r*.03
   );

   x.lineTo(
    Math.cos(a)*r,
    Math.sin(a)*r
   );

   x.stroke();
  }

  x.restore();
 }

 requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

/*
 CONTROL CON DEDO/MOUSE
 */

function move(X,Y){

 px+=(X-W/2-px)*.035;
 py+=(Y-H/2-py)*.035;
}

c.addEventListener(
 "pointerdown",
 e=>{
  down=true;
 }
);

c.addEventListener(
 "pointermove",
 e=>{
  if(down) move(e.clientX,e.clientY);
 }
);

addEventListener(
 "pointerup",
 ()=>{
  down=false;
 }
);

setTimeout(
 ()=>{
  document.getElementById("hint").style.opacity=0;
 },
 4500
);

</script>

</body>
  </html>
